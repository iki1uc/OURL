<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Optionlichkeiten-System</title>
    <style>
        body { font-family: Arial; background:#f4f4f4; padding:20px; }
        .menu { margin-bottom:20px; }
        .menu button { padding:10px 20px; margin:5px; font-size:16px; }
        .section { background:white; padding:20px; margin-top:20px; border-radius:8px; }
        h2 { margin-top:0; }
    </style>
</head>

<body>

    <h1>Optionlichkeiten-System</h1>

    <div class="menu">
        <h2>Sicht wählen</h2>
        <button onclick="loadView('3x3')">3×3</button>
        <button onclick="loadView('9x9')">9×9</button>
        <button onclick="loadView('81')">81</button>
        <button onclick="loadView('243')">243</button>
    </div>

    <div id="content" class="section">
        <h2>Willkommen</h2>
        <p>Wähle eine Sicht oben im Menü.</p>
    </div>

    <script>
        function loadView(view) {
            let content = document.getElementById("content");

            if (view === "3x3") {
                content.innerHTML = `
                    <h2>3×3 Sicht</h2>
                    <p>Kleine Sicht. Klare Führung. 9 Felder.</p>
                `;
            }

            if (view === "9x9") {
                content.innerHTML = `
                    <h2>9×9 Sicht</h2>
                    <p>Mittlere Sicht. 81 Felder. Für unentschlossene oder komplexe Anfragen.</p>
                `;
            }

            if (view === "81") {
                content.innerHTML = `
                    <h2>81er Vollsicht</h2>
                    <p>Alle 81 Felder sichtbar. Buch / Weg-Buch / Option pro Feld.</p>
                `;
            }

            if (view === "243") {
                content.innerHTML = `
                    <h2>243er Tiefsicht</h2>
                    <p>Tiefste Optionlichkeiten. Nur wenn absolut notwendig.</p>
                `;
            }
        }
    </script>

</body>
</html>
